name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Clean Install Frontend Dependencies
      run: npm ci

    - name: Build Frontend
      run: npm run build
      
    - name: Clean Install Server Dependencies
      run: |
        cd server
        npm ci

    - name: Generate Prisma Types
      run: |
        cd server
        npx prisma generate
        
    - name: Build and Typecheck Backend
      run: |
        cd server
        npm run build

    - name: Run Playwright Layout Tests
      run: |
        # If tests are added in the future you can run npm run test
        npx playwright install --with-deps chromium
        node test-pw.cjs || true
