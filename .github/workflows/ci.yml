name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Clean Install Frontend Dependencies
      run: npm ci

    - name: Strict typecheck (frontend app project)
      run: npx tsc -p tsconfig.app.json --noEmit

    - name: Build Frontend
      run: npm run build

    - name: Upload client dist
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: client-dist
        path: dist/
        retention-days: 7
      
    - name: Clean Install Server Dependencies
      run: cd server && npm ci

    - name: Generate Prisma Types
      run: cd server && npx prisma generate
        
    - name: Build and Typecheck Backend
      run: cd server && npm run build

    - name: Run Server Tests
      run: cd server && npm test
      env:
        JWT_SECRET: test-secret-key-for-ci-minimum-32-chars
        DATABASE_URL: postgresql://test:test@localhost:5432/test
        NODE_ENV: test
        CORS_ORIGIN: http://localhost:5173
        COOKIE_DOMAIN: localhost
        ADMIN_EMAILS: admin@test.com

    - name: Run Frontend Tests
      run: npm test


  exchange-evidence-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: exchange_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d exchange_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/exchange_test
      INTEGRATION_DATABASE_URL: postgresql://test:test@localhost:5432/exchange_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npx prisma generate
        working-directory: server
      - run: npm run test:integration
        working-directory: server
