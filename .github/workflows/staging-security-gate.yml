name: Staging Security Gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to validate'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  security-chain-staging:
    name: Run Staging Security Chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate required staging configuration
        env:
          E2E_WEB_URL: ${{ vars.E2E_STAGING_WEB_URL }}
          E2E_API_URL: ${{ vars.E2E_STAGING_API_URL }}
          E2E_STAGING_EMAIL: ${{ secrets.E2E_STAGING_EMAIL }}
          E2E_STAGING_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          if [ -z "${E2E_WEB_URL}" ]; then
            echo "Missing GitHub Environment variable: E2E_STAGING_WEB_URL"
            missing=1
          fi
          if [ -z "${E2E_API_URL}" ]; then
            echo "Missing GitHub Environment variable: E2E_STAGING_API_URL"
            missing=1
          fi
          if [ -z "${E2E_STAGING_EMAIL}" ]; then
            echo "Missing GitHub Environment secret: E2E_STAGING_EMAIL"
            missing=1
          fi
          if [ -z "${E2E_STAGING_PASSWORD}" ]; then
            echo "Missing GitHub Environment secret: E2E_STAGING_PASSWORD"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Staging security gate preflight failed due missing configuration."
            exit 1
          fi

      - name: Verify staging targets are reachable
        env:
          E2E_WEB_URL: ${{ vars.E2E_STAGING_WEB_URL }}
          E2E_API_URL: ${{ vars.E2E_STAGING_API_URL }}
        run: |
          set -euo pipefail

          echo "Checking web target: ${E2E_WEB_URL}"
          curl -fsS --max-time 15 "${E2E_WEB_URL}" > /dev/null

          echo "Checking API target: ${E2E_API_URL}/health/ready"
          curl -fsS --max-time 15 "${E2E_API_URL}/health/ready" > /dev/null

      - name: Run staging security auth chain
        env:
          E2E_WEB_URL: ${{ vars.E2E_STAGING_WEB_URL }}
          E2E_API_URL: ${{ vars.E2E_STAGING_API_URL }}
          E2E_STAGING_EMAIL: ${{ secrets.E2E_STAGING_EMAIL }}
          E2E_STAGING_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
        run: npm run test:e2e:security-chain:staging

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-security-report
          path: playwright-report/
          if-no-files-found: ignore