name: Staging Security Gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to validate'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  security-chain-staging:
    name: Run Staging Security Chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      E2E_WEB_URL: ${{ vars.E2E_STAGING_WEB_URL || 'https://staging.rgitrozgar.in' }}
      E2E_API_URL: ${{ vars.E2E_STAGING_API_URL || vars.E2E_STAGING_WEB_URL || 'https://staging.rgitrozgar.in' }}
      E2E_STAGING_EMAIL: ${{ secrets.E2E_STAGING_EMAIL || '' }}
      E2E_STAGING_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate required staging configuration
        run: |
          set -euo pipefail

          echo "Using staging web target: ${E2E_WEB_URL}"
          echo "Using staging API target: ${E2E_API_URL}"

          if [ -z "${E2E_STAGING_EMAIL}" ] || [ -z "${E2E_STAGING_PASSWORD}" ]; then
            echo "Staging credentials are not configured; the auth-chain test will skip."
          fi

      - name: Verify staging targets are reachable
        run: |
          set -euo pipefail

          if [ -z "${E2E_WEB_URL}" ] || [ -z "${E2E_API_URL}" ]; then
            echo "Staging target URLs are not configured; skipping reachability checks."
            exit 0
          fi

          web_host=$(echo "${E2E_WEB_URL}" | sed -E 's#^https?://##; s#/.*$##')
          api_host=$(echo "${E2E_API_URL}" | sed -E 's#^https?://##; s#/.*$##')

          if ! getent hosts "${web_host}" > /dev/null; then
            echo "Staging web host '${web_host}' is not resolvable from runner; skipping reachability checks."
            exit 0
          fi

          if ! getent hosts "${api_host}" > /dev/null; then
            echo "Staging API host '${api_host}' is not resolvable from runner; skipping reachability checks."
            exit 0
          fi

          echo "Checking web target: ${E2E_WEB_URL}"
          curl -fsS --max-time 15 "${E2E_WEB_URL}" > /dev/null

          echo "Checking API target: ${E2E_API_URL}/health/ready"
          curl -fsS --max-time 15 "${E2E_API_URL}/health/ready" > /dev/null

      - name: Run staging security auth chain
        run: |
          set -euo pipefail

          if [ ! -f "e2e/security-auth-chain.staging.spec.ts" ]; then
            echo "Staging auth-chain spec is not present on this ref; skipping."
            exit 0
          fi

          if [ -z "${E2E_STAGING_EMAIL}" ] || [ -z "${E2E_STAGING_PASSWORD}" ]; then
            echo "Staging credentials are not configured; skipping auth-chain execution."
            exit 0
          fi

          npx playwright test e2e/security-auth-chain.staging.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-security-report
          path: playwright-report/
          if-no-files-found: ignore