<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00d4aa" />
    <!-- CSP: lock down resource origins for production -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self' 'unsafe-inline' 'wasm-unsafe-eval';
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com;
        img-src     'self' data: blob:;
        connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;
        worker-src  'self' blob:;
        frame-src   'self' https://www.google.com;
        object-src  'none';
        base-uri    'self';
      "
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>BErozgar — Campus Trust Exchange | MCTRGIT</title>

    <!-- Non-blocking font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <meta name="description" content="BErozgar is a student-centric digital ecosystem for MCTRGIT, enabling trust-based campus exchanges, accommodation discovery, academic resource sharing, and daily living support." />
    <meta name="author" content="BErozgar" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://rgitrozgar.in/" />

    <meta property="og:title" content="BErozgar — Campus Trust Exchange" />
    <meta property="og:description" content="A student-centric digital ecosystem crafting trust & seamless interactions for campus life at MCTRGIT." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rgitrozgar.in/" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:site_name" content="BErozgar" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Berozgar" />
    <meta name="twitter:title" content="BErozgar — Campus Trust Exchange" />
    <meta name="twitter:description" content="Trust-based campus exchange platform for MCTRGIT students." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Ensure light theme before React loads — inline to prevent FOUC -->
    <script>
      document.documentElement.classList.remove('dark');
      document.documentElement.classList.add('light');
    </script>
  </head>

  <body>
    <div id="root">
      <div style="position: absolute; inset: 0; background-color: #050505; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; overflow: hidden;">
        <div style="position: relative; width: 120px; height: 140px; margin-bottom: 24px;">
          <!-- Branded Shield Logo Placeholder -->
          <div style="position: absolute; inset: 0; background: linear-gradient(135deg, #1a2332 0%, #0f172a 100%); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); filter: drop-shadow(0 0 30px rgba(33, 150, 243, 0.2));"></div>
          <div style="position: absolute; inset: 2px; background: #050505; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); opacity: 0.8;"></div>
          <!-- Pulse Effect -->
          <div style="position: absolute; inset: 0; background: #D4A843; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); opacity: 0.15; animation: shield-pulse 2.5s ease-in-out infinite;"></div>
        </div>
        <p style="color: #ffffff; letter-spacing: 0.3em; text-transform: uppercase; font-size: 13px; font-weight: 500; font-family: 'Syne', sans-serif; margin-bottom: 8px;">Initializing Campus OS</p>
        <div style="width: 140px; height: 2px; background: rgba(255,255,255,0.05); position: relative; border-radius: 10px; overflow: hidden;">
          <div style="position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #D4A843, transparent); width: 40%; animation: loader-slide 1.5s ease-in-out infinite;"></div>
        </div>
        <style>
          @keyframes shield-pulse { 0% { transform: scale(0.9); opacity: 0.05; } 50% { transform: scale(1.05); opacity: 0.25; } 100% { transform: scale(0.9); opacity: 0.05; } }
          @keyframes loader-slide { from { left: -50%; } to { left: 100%; } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
