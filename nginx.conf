server {
    listen       80;
    server_name  localhost;
    
    # Enable Gzip and Brotli compression in Nginx if supported
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # SPA routing: if file doesn't exist, serve index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend Fastify instance
    location /api/ {
        # 'backend' is the docker network hostname defined in docker-compose.yml
        proxy_pass http://backend:3001; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Propagate IP to backend for rate-limiting calculations
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
