# BErozgar — Standalone SPA server block (conf.d include)
#
# PROD-FIX: the root Dockerfile used to copy nginx/nginx.conf (a FULL
# top-level nginx.conf with `user`, `events` and `http` blocks) into
# /etc/nginx/conf.d/default.conf — which is invalid there and made the
# standalone frontend image crash-loop at startup. This file is a proper
# conf.d server block for the standalone image.
#
# The docker-compose.prod.yml deployment still mounts nginx/nginx.conf
# as the full /etc/nginx/nginx.conf — that path is unchanged.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location /assets/ {
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
